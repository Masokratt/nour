<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطوبة أحمد & ياسمين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold-light: #f7e8b4;
  --gold-mid: #c9a84c;
  --gold-dark: #a07828;
}

html { scroll-behavior: smooth; }

body {
  background-color: #110c06;
  background-image: radial-gradient(circle at center, #1f160b 0%, #0a0703 100%);
  font-family: 'Noto Naskh Arabic', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══ SPLASH SCREEN (شاشة الفتح التلقائي) ═══ */
#splashOverlay {
  position: fixed;
  inset: 0;
  background: #110c06;
  background-image: radial-gradient(circle at center, #1f160b 0%, #0a0703 100%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 0.8s ease, visibility 0.8s;
  color: var(--gold-light);
  text-align: center;
  padding: 20px;
}
#splashOverlay.fade-out {
  opacity: 0;
  visibility: hidden;
}
.splash-btn {
  background: transparent;
  color: var(--gold-light);
  border: 1px solid var(--gold-mid);
  padding: 14px 36px;
  font-size: 1.2rem;
  font-family: 'Amiri', serif;
  cursor: pointer;
  border-radius: 30px;
  box-shadow: 0 0 15px rgba(201, 168, 76, 0.2);
  transition: all 0.4s ease;
  margin-top: 20px;
}
.splash-btn:hover {
  background: var(--gold-mid);
  color: #110c06;
  box-shadow: 0 0 25px rgba(201, 168, 76, 0.5);
  transform: scale(1.05);
}
.splash-title {
  font-family: 'Amiri', serif;
  font-size: 2rem;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

/* ═══ CARD WRAPPER ═══ */
.card-wrapper {
  position: relative;
  width: 100%;
  max-width: 500px;
  background-color: #faf6ee;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(201, 168, 76, 0.1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@media (max-width: 500px) {
  .card-wrapper {
    min-height: 100vh;
    box-shadow: none;
  }
}

/* ═══ MAIN IMAGE ═══ */
.main-bg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 100vh;
  object-fit: cover;
  object-position: top;
}

/* ═══ CANVAS PARTICLES ═══ */
#canvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.8;
}

/* ═══ FLOATING BUTTONS ═══ */
.fabs {
  position: absolute;
  left: 20px;
  bottom: 30px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  z-index: 10;
}

.fab {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(201, 168, 76, 0.4);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

.fab:nth-child(1) { animation: fabPop 0.6s ease 1s forwards; }
.fab:nth-child(2) { animation: fabPop 0.6s ease 1.2s forwards; }
.fab:nth-child(3) { animation: fabPop 0.6s ease 1.4s forwards; }

@keyframes fabPop {
  from { opacity: 0; transform: translateY(20px) scale(0.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.fab:hover {
  transform: scale(1.1) translateY(-4px);
  background: rgba(255, 255, 255, 0.25);
  border-color: var(--gold-mid);
  box-shadow: 0 12px 40px rgba(201, 168, 76, 0.3);
}

.tip {
  position: absolute;
  left: calc(100% + 14px);
  background: rgba(26, 18, 8, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--gold-light);
  font-size: 0.8rem;
  padding: 8px 16px;
  border-radius: 20px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.3s ease;
  border: 1px solid rgba(201, 168, 76, 0.3);
}
.fab:hover .tip { opacity: 1; transform: translateX(0); }

.fab svg {
  fill: #fff;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  transition: fill 0.3s ease;
}
.fab-music svg { fill: var(--gold-mid); }
.fab-wa:hover svg { fill: #2ecc71; }
.fab-loc:hover svg { fill: #e74c3c; }
.fab-music:hover svg { fill: var(--gold-light); }

/* ═══ MUSIC PANEL ═══ */
.music-panel {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(18, 12, 4, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(201, 168, 76, 0.3);
  padding: 20px;
  display: flex; align-items: center; gap: 15px;
  z-index: 9;
  transform: translateY(100%);
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.music-panel.open { transform: translateY(0); }
.music-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.music-title { color: var(--gold-mid); font-family: 'Amiri', serif; font-size: 1.1rem; }
.music-sub { color: rgba(255,255,255,0.6); font-size: 0.75rem; }
.music-audio { height: 36px; width: 100%; max-width: 200px; }
.music-audio::-webkit-media-controls-panel { background: rgba(255, 255, 255, 0.9); }
.music-close {
  background: none; border: none; color: var(--gold-mid);
  font-size: 1.5rem; cursor: pointer; padding: 5px;
  transition: transform 0.3s;
}
.music-close:hover { transform: scale(1.2) rotate(90deg); color: var(--gold-light); }

/* NOTE PULSE */
.note-dot {
  position: absolute; top: -2px; right: -2px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--gold-mid);
  border: 2px solid #fff;
  display: none;
}
.note-dot.active { display: block; animation: notePulse 1.5s infinite; }
@keyframes notePulse {
  0% { box-shadow: 0 0 0 0 rgba(201, 168, 76, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(201, 168, 76, 0); }
  100% { box-shadow: 0 0 0 0 rgba(201, 168, 76, 0); }
}

@media(max-width: 480px) {
  .fabs { left: 16px; bottom: 24px; }
  .fab { width: 48px; height: 48px; }
  .tip { display: none; }
}
</style>
</head>
<body>

<div id="splashOverlay">
  <h2 class="splash-title"> خطوبة أحمد & ياسمين</h2>
  <p>فرحتنا مش هتكمل غير بيكم</p>
  <button class="splash-btn" onclick="openInvitation()">فتح الدعوة ✉️</button>
</div>

<div class="card-wrapper">
  
  <img src="photo.jpg" alt="دعوة حفل خطوبة" class="main-bg">

  <canvas id="canvas"></canvas>

  <div class="fabs">
    <a class="fab fab-wa" href="https://wa.me/201142033469?text=ألف مبروك — سأكون حاضراً بإذن الله" target="_blank">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span class="tip">تأكيد الحضور 💍</span>
    </a>

    <a class="fab fab-loc" href="https://maps.app.goo.gl/65e75tX74XLFUXsd8" target="_blank">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      <span class="tip">موقع القاعة 📍</span>
    </a>

    <button class="fab fab-music" onclick="toggleMusic()">
      <div class="note-dot" id="noteDot"></div>
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <span class="tip">الموسيقى 🎶</span>
    </button>
  </div>

  <div class="music-panel" id="musicPanel">
    <div class="music-info">
      <span class="music-title">موسيقى الفرح</span>
      <span class="music-sub">جاري التشغيل...</span>
    </div>
    <audio class="music-audio" id="audioPlayer" controls controlsList="nodownload" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>
    <button class="music-close" onclick="toggleMusic()">✕</button>
  </div>

</div>

<script>
/* ════ PARTICLES (CONFINED TO CARD) ════ */
(function(){
  const wrapper = document.querySelector('.card-wrapper');
  const c = document.getElementById('canvas');
  const ctx = c.getContext('2d');
  let W, H, pts = [];

  function resize(){
    W = c.width = wrapper.clientWidth;
    H = c.height = wrapper.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);

  function mkPt(){
    const type = Math.random() < .7 ? 'dust' : 'spark';
    return {
      type,
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * .2,
      vy: -.1 - Math.random() * .3,
      size: type === 'dust' ? .8 + Math.random() * 1.5 : 1.5 + Math.random() * 2,
      alpha: Math.random() * .6 + .2,
      life: Math.random(),
      decay: .001 + Math.random() * .002,
      rot: Math.random() * Math.PI * 2,
      rspd: (Math.random() - .5) * .03,
      hue: 38 + Math.random() * 15,
    };
  }

  for(let i=0; i<70; i++){
    const p = mkPt();
    p.life = Math.random();
    p.y = Math.random() * H;
    pts.push(p);
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    pts.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rspd;
      p.life -= p.decay;

      if(p.life <= 0 || p.y < -20 || p.x < -20 || p.x > W + 20){
        pts[i] = mkPt();
        pts[i].y = H + 10;
        pts[i].x = Math.random() * W;
        pts[i].life = 1;
        return;
      }

      const a = p.alpha * Math.min(p.life * 4, 1) * Math.min((1 - p.life) * 4, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);

      if(p.type === 'dust'){
        ctx.fillStyle = `hsl(${p.hue}, 70%, 65%)`;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsl(${p.hue}, 80%, 70%)`;
      } else {
        ctx.fillStyle = `hsl(${p.hue}, 80%, 80%)`;
        ctx.beginPath();
        for(let j=0; j<4; j++){
          const a1 = j * Math.PI / 2, a2 = (j + .5) * Math.PI / 2;
          const r1 = p.size, r2 = p.size * .3;
          if(j === 0) ctx.moveTo(r1 * Math.cos(a1), r1 * Math.sin(a1));
          else ctx.lineTo(r1 * Math.cos(a1), r1 * Math.sin(a1));
          ctx.lineTo(r2 * Math.cos(a2), r2 * Math.sin(a2));
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ════ دالة فتح الكارت وتشغيل الصوت فوراً ════ */
function openInvitation() {
  const overlay = document.getElementById('splashOverlay');
  const audio = document.getElementById('audioPlayer');
  const dot = document.getElementById('noteDot');
  
  // إخفاء الشاشة بأنيميشن ناعم
  overlay.classList.add('fade-out');
  
  // تشغيل الموسيقى فوراً (التفاعل حدث بالضغط على الزر)
  audio.play().then(() => {
    dot.classList.add('active');
  }).catch(err => console.log("Audio play failed:", err));
}

/* ════ MUSIC CONTROL ════ */
let musicOpen = false;
function toggleMusic(){
  musicOpen = !musicOpen;
  document.getElementById('musicPanel').classList.toggle('open', musicOpen);
  const dot = document.getElementById('noteDot');
  const audio = document.getElementById('audioPlayer');
  
  if(musicOpen){
    audio.play().catch(()=>{});
    dot.classList.add('active');
  } else {
    audio.pause();
    dot.classList.remove('active');
  }
}

// مزامنة حالة الزر والنقطة المنورة لو الصوت وقف أو اشتغل يدوي
document.getElementById('audioPlayer').addEventListener('pause', () => {
  document.getElementById('noteDot').classList.remove('active');
});
document.getElementById('audioPlayer').addEventListener('play', () => {
  document.getElementById('noteDot').classList.add('active');
});
</script>
</body>
</html>
